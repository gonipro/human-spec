<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 인간 사양표</title>
<style>
  :root{--win:#f5f5f7;--ink:#1d1d1f;--sub:#6e6e73;--line:#e3e3e8;--accent:#0a84ff}
  @media (prefers-color-scheme:dark){:root{--win:#2b2b2e;--ink:#f5f5f7;--sub:#a1a1a6;--line:#3a3a3e}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}.win{position:relative;z-index:1;width:560px;background:var(--win);color:var(--ink);border-radius:14px;box-shadow:0 30px 60px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.2);overflow:hidden}
  .bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px}
  .bar i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .body{display:flex;gap:28px;padding:10px 34px 30px}
  .pic{width:150px;height:150px;border-radius:32px;flex:none;display:grid;place-items:center;font-size:72px;font-weight:800;color:#fff;background:linear-gradient(135deg,#6366f1,#ec4899)}
  h1{margin:4px 0 2px;font-size:30px;letter-spacing:-.5px}
  .model{color:var(--sub);font-size:14px;margin-bottom:14px}
  .row{display:flex;font-size:13.5px;line-height:1.9}
  .row b{width:92px;flex:none;text-align:right;padding-right:12px;font-weight:600}
  .row span{color:var(--ink)}
  .tabs{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(255,59,48,.1);font-size:13.5px}
  .tabs b{color:#ff3b30}
  .foot{border-top:1px solid var(--line);padding:12px 34px;font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between}
  .btn{display:inline-block;margin-top:14px;padding:5px 14px;border-radius:7px;background:var(--line);font-size:13px}
</style></head><body>
<svg id="bg" preserveAspectRatio="xMidYMid slice"></svg>
<div class="win">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="body">
    <div class="pic" id="pic">G</div>
    <div>
      <h1 id="name">Gowoon</h1>
      <div class="model" id="model">Human Pro · 2026년형</div>
      <div id="rows"></div>
      <div class="tabs" id="tabs"></div>
      <div class="btn" id="tip">오늘 닫을 탭: …</div>
    </div>
  </div>
  <div class="foot"><span id="sum"></span><span>human-spec · GoniPro</span></div>
</div>
<script>
/* 데이터만 바꾸면 돼요 */
const D = window.SPEC || {
  name: "Gowoon", initial: "G", model: "Human Pro · 2026년형",
  rows: [
    ["칩 (CPU)", "결정 속도 최상급 · \"응\" 0.5초"],
    ["메모리 (램)", "아주 큼 · 하루 일 7개 동시 실행"],
    ["저장 공간", "대용량 · 2007년부터 쌓인 글"],
    ["그래픽", "고성능 · 아이디어 계속 출력"],
    ["센서", "특수 장비 · 한 글자 차이까지 감지"],
    ["쿨링팬", "저소음 · 잘 안 돎"],
    ["배터리", "절전 모드 권장"]
  ],
  tabs: "열린 탭 <b>280개</b> · 스왑 메모리 과부하",
  tip: "오늘 닫을 탭: 이번 주 안 해도 되는 일 1개",
  sum: "사양은 최고급, 탭 정리 필요 ㅋㅋ"
};
{const q=new URLSearchParams(location.search);if(q.get("n")){D.name=q.get("n");D.initial=q.get("n")[0].toUpperCase()}}
/* 사람마다 다른 배경: 이름으로 색·모양이 정해져요(같은 이름이면 늘 같은 배경) */
(function(){
  const PAL=[["#0f172a","#6366f1","#ec4899","#f59e0b"],["#052e2b","#10b981","#22d3ee","#a3e635"],["#1e1b4b","#a855f7","#f472b6","#fde68a"],["#1a0f0a","#f97316","#ef4444","#fbbf24"],["#0b1324","#38bdf8","#818cf8","#e0f2fe"],["#1f2937","#f43f5e","#fb7185","#fda4af"],["#14120c","#eab308","#84cc16","#fef08a"],["#0c0a1e","#7c3aed","#06b6d4","#f0abfc"],["#101820","#ff8a3d","#ffd23f","#3dd6d0"],["#1b1b1f","#94a3b8","#e2e8f0","#60a5fa"]];
  let h=2166136261; for(const c of (D.seed||D.name||"?")) h=Math.imul(h^c.codePointAt(0),16777619)>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296};
  const p=D.palette||PAL[h%PAL.length]; const W=1440,H=1120;
  const style=Math.floor(rnd()*3);
  let g=`<defs><filter id="b"><feGaussianBlur stdDeviation="70"/></filter><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p[1]}"/><stop offset="1" stop-color="${p[2]}"/></linearGradient></defs><rect width="${W}" height="${H}" fill="${p[0]}"/>`;
  g+=`<g filter="url(#b)" opacity=".9">`; for(let i=0;i<6;i++){g+=`<circle cx="${rnd()*W}" cy="${rnd()*H}" r="${180+rnd()*260}" fill="${p[1+i%3]}"/>`} g+=`</g>`;
  if(style===0){for(let i=0;i<7;i++){const y=H*(.15+i*.11)+rnd()*40;g+=`<path d="M0 ${y} C ${W*.3} ${y-120*rnd()}, ${W*.6} ${y+140*rnd()}, ${W} ${y-60}" fill="none" stroke="${p[3]}" stroke-opacity=".18" stroke-width="2"/>`}}
  if(style===1){for(let i=0;i<40;i++){g+=`<circle cx="${rnd()*W}" cy="${rnd()*H}" r="${1+rnd()*3}" fill="${p[3]}" opacity="${.3+rnd()*.5}"/>`}}
  if(style===2){for(let i=0;i<5;i++){const x=rnd()*W,y=rnd()*H,r=120+rnd()*220;g+=`<circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${p[3]}" stroke-opacity=".2" stroke-width="1.5"/>`}}
  const bg=document.getElementById("bg"); bg.setAttribute("viewBox",`0 0 ${W} ${H}`); bg.innerHTML=g;
  document.getElementById("pic").style.background=`linear-gradient(135deg,${p[1]},${p[2]})`;
})();
document.getElementById("name").textContent = D.name;
document.getElementById("pic").textContent = D.initial || (D.name||"?")[0];
document.getElementById("model").textContent = D.model;
document.getElementById("rows").innerHTML = D.rows.map(r => `<div class="row"><b>${r[0]}</b><span>${r[1]}</span></div>`).join("");
document.getElementById("tabs").innerHTML = D.tabs;
document.getElementById("tip").textContent = D.tip;
document.getElementById("sum").textContent = D.sum;
</script>
</body></html>
