<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 인간 사양표</title>
<style>
  :root{--win:#f5f5f7;--ink:#1d1d1f;--sub:#6e6e73;--line:#e3e3e8;--accent:#0a84ff}
  @media (prefers-color-scheme:dark){:root{--win:#2b2b2e;--ink:#f5f5f7;--sub:#a1a1a6;--line:#3a3a3e}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}.win{position:relative;z-index:1;width:560px;background:var(--win);color:var(--ink);border-radius:14px;box-shadow:0 30px 60px rgba(0,0,0,.25),0 0 0 .5px rgba(0,0,0,.2);overflow:hidden}
  .bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px}
  .bar i{width:12px;height:12px;border-radius:50%;display:inline-block}
  .body{display:flex;gap:28px;padding:10px 34px 30px}
  .pic{width:150px;height:150px;border-radius:32px;flex:none;display:grid;place-items:center;font-size:72px;font-weight:800;color:#fff;background:linear-gradient(135deg,#6366f1,#ec4899)}
  h1{margin:4px 0 2px;font-size:30px;letter-spacing:-.5px}
  .model{color:var(--sub);font-size:14px;margin-bottom:14px}
  .row{display:flex;font-size:13.5px;line-height:1.9}
  .row b{width:92px;flex:none;text-align:right;padding-right:12px;font-weight:600}
  .row span{color:var(--ink)}
  .tabs{margin-top:14px;padding:12px 14px;border-radius:10px;background:rgba(255,59,48,.1);font-size:13.5px}
  .tabs b{color:#ff3b30}
  .foot{border-top:1px solid var(--line);padding:12px 34px;font-size:12.5px;color:var(--sub);display:flex;justify-content:space-between}
  /* 세로판(스레드·인스타 피드·댓글용 4:5): ?tall=1 또는 D.tall */
  body.tall{padding:58px 0 128px;box-sizing:border-box}body.tall .win{width:620px;zoom:1.3}
  body.tall .body{flex-direction:column;align-items:center;text-align:center;gap:14px;padding:18px 40px 34px}
  body.tall .pic{width:170px;height:170px;font-size:84px;border-radius:40px}
  body.tall h1{font-size:44px}
  body.tall .model{font-size:19px;margin-bottom:18px}
  body.tall .row{font-size:20px;line-height:2;justify-content:center}
  body.tall .row b{width:auto;text-align:right;padding-right:12px}
  body.tall .tabs{font-size:21px;margin-top:20px}
  body.tall .btn{font-size:19px;margin-top:16px;padding:8px 16px}
  body.tall .foot{font-size:16px}
  /* 컴퓨터를 켠 느낌: 위 메뉴 막대 + 아래 독 */
  .menubar{position:fixed;top:0;left:0;right:0;height:30px;z-index:2;display:flex;align-items:center;gap:18px;padding:0 16px;background:rgba(255,255,255,.28);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#fff;font-size:13.5px;font-weight:500;text-shadow:0 1px 2px rgba(0,0,0,.25)}
  .menubar b{font-weight:800}.menubar .r{margin-left:auto;display:flex;gap:14px;align-items:center}
  .bat{display:inline-flex;align-items:center;gap:4px}.bat i{display:inline-block;width:24px;height:11px;border:1.5px solid #fff;border-radius:3px;position:relative}.bat i:after{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:3px;background:#ff453a;border-radius:1px}
  .dock{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:2;display:flex;gap:10px;padding:9px 12px;border-radius:22px;background:rgba(255,255,255,.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .dock span{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4)}
  .dock span.on{position:relative}.dock span.on:after{content:"";position:absolute;bottom:-7px;width:4px;height:4px;border-radius:50%;background:#fff}
  body.tall .menubar{height:44px;font-size:20px;gap:24px;padding:0 24px}body.tall .bat i{width:34px;height:16px}
  body.tall .dock{bottom:26px;gap:14px;padding:12px 16px;border-radius:28px}body.tall .dock span{width:70px;height:70px;border-radius:18px}
  .btn{display:inline-block;margin-top:14px;padding:5px 14px;border-radius:7px;background:var(--line);font-size:13px}
</style></head><body>
<svg id="bg" preserveAspectRatio="xMidYMid slice"></svg>
<div class="menubar"><b>Human</b><span>파일</span><span>편집</span><span>보기</span><span>창</span><span class="r"><span class="bat"><span id="batp">5%</span><i></i></span><span id="clock">오전 2:14</span></span></div>
<div class="dock"><span class="on" style="background:linear-gradient(135deg,#34c759,#30b0c7)"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18 3.5 21 8 19.2c1.2.5 2.6.8 4 .8 5 0 9-3.4 9-7.5S17 5 12 5 3 8.4 3 12.5c0 2.1 1 4 2 5.5Z"/></svg></span><span class="on" style="background:linear-gradient(135deg,#5ac8fa,#007aff)"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h6l2 2h10v10H3z"/></svg></span><span class="" style="background:linear-gradient(135deg,#ffcc00,#ff9500)"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10v18H7zM10 7h4M10 11h4M10 15h2"/></svg></span><span class="on" style="background:linear-gradient(135deg,#3a3a3c,#1c1c1e)"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7l5 5-5 5M12 17h7"/></svg></span><span class="" style="background:linear-gradient(135deg,#ff2d55,#af52de)"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.5-7 10-7 10z"/></svg></span><span class="" style="background:linear-gradient(135deg,#8e8e93,#636366)"><svg viewBox="0 0 24 24" width="60%" height="60%" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></span></div>
<div class="win">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
  <div class="body">
    <div class="pic" id="pic">G</div>
    <div>
      <h1 id="name">Gowoon</h1>
      <div class="model" id="model">Human Pro · 2026년형</div>
      <div id="rows"></div>
      <div class="tabs" id="tabs"></div>
      <div class="btn" id="tip">오늘 닫을 탭: …</div>
    </div>
  </div>
  <div class="foot"><span id="sum"></span><span>human-spec · GoniPro</span></div>
</div>
<script>
/* 데이터만 바꾸면 돼요 */
const D = window.SPEC || {
  name: "Gowoon", initial: "G", model: "Human Pro · 2026년형",
  rows: [
    ["칩 (CPU)", "결정 속도 최상급 · \"응\" 0.5초"],
    ["메모리 (램)", "아주 큼 · 하루 일 7개 동시 실행"],
    ["저장 공간", "대용량 · 2007년부터 쌓인 글"],
    ["그래픽", "고성능 · 아이디어 계속 출력"],
    ["센서", "특수 장비 · 한 글자 차이까지 감지"],
    ["쿨링팬", "저소음 · 잘 안 돎"],
    ["배터리", "절전 모드 권장"]
  ],
  tabs: "열린 탭 <b>280개</b> · 스왑 메모리 과부하",
  tip: "오늘 닫을 탭: 이번 주 안 해도 되는 일 1개",
  sum: "사양은 최고급, 탭 정리 필요 ㅋㅋ",
  battery: "5%", clock: "오전 2:14",
  state: "overload"   /* overload 과부하 · lowbattery 배터리 부족 · focus 집중 · creative 아이디어 폭발 · calm 여유 */
};
{const q=new URLSearchParams(location.search);if(q.get("n")){D.name=q.get("n");D.initial=q.get("n")[0].toUpperCase()}if(q.get("s"))D.state=q.get("s");if(q.get("tall")||D.tall)document.body.classList.add("tall")}
/* 배경 = 그 사람 지금 상태(state) + 이름으로 정해지는 모양. 같은 상태라도 사람마다 조금씩 달라요 */
(function(){
  const ST={
    overload:{p:["#1a0806","#ff453a","#ff9f0a","#ffd60a"],m:"tabs",label:"과부하"},
    lowbattery:{p:["#070b1f","#5e5ce6","#30336b","#cfd8ff"],m:"night",label:"배터리 부족"},
    focus:{p:["#03161c","#0a84ff","#30d5c8","#9be7ff"],m:"rings",label:"집중"},
    creative:{p:["#12061f","#bf5af2","#ff375f","#ffd60a"],m:"sparks",label:"아이디어 폭발"},
    calm:{p:["#0d1a12","#34c759","#a8e063","#f1f8e9"],m:"waves",label:"여유"}
  };
  let h=2166136261; for(const c of (D.seed||D.name||"?")) h=Math.imul(h^c.codePointAt(0),16777619)>>>0;
  const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>17;h^=h<<5;h>>>=0;return h/4294967296};
  const keys=Object.keys(ST); const st=ST[D.state]||ST[keys[h%keys.length]]; const p=D.palette||st.p; const W=1440,H=1800;
  let g=`<defs><filter id="b"><feGaussianBlur stdDeviation="80"/></filter></defs><rect width="${W}" height="${H}" fill="${p[0]}"/><g filter="url(#b)" opacity=".85">`;
  for(let i=0;i<6;i++) g+=`<circle cx="${rnd()*W}" cy="${rnd()*H}" r="${200+rnd()*280}" fill="${p[1+i%3]}"/>`; g+=`</g>`;
  if(st.m==="tabs"){ for(let i=0;i<26;i++){const w=120+rnd()*160,x=rnd()*W,y=rnd()*H,r=(rnd()-.5)*24;g+=`<g transform="rotate(${r} ${x} ${y})" opacity="${.18+rnd()*.25}"><rect x="${x}" y="${y}" width="${w}" height="${w*.68}" rx="10" fill="none" stroke="${p[3]}" stroke-width="2"/><rect x="${x}" y="${y}" width="${w}" height="16" rx="8" fill="${p[3]}" opacity=".5"/></g>`}
    for(let i=0;i<5;i++){const y=H*(.2+i*.15);g+=`<path d="M0 ${y} q 60 -30 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0 t 120 0" fill="none" stroke="${p[2]}" stroke-opacity=".22" stroke-width="3"/>`} }
  if(st.m==="night"){ g+=`<circle cx="${W*.78}" cy="${H*.16}" r="70" fill="${p[3]}" opacity=".9"/><circle cx="${W*.78+28}" cy="${H*.16-18}" r="62" fill="${p[0]}"/>`; for(let i=0;i<90;i++) g+=`<circle cx="${rnd()*W}" cy="${rnd()*H}" r="${.8+rnd()*2.4}" fill="${p[3]}" opacity="${.3+rnd()*.6}"/>`; }
  if(st.m==="rings"){ const cx=W*(.3+rnd()*.4),cy=H*(.3+rnd()*.4); for(let i=1;i<12;i++) g+=`<circle cx="${cx}" cy="${cy}" r="${i*90}" fill="none" stroke="${p[3]}" stroke-opacity="${.28-i*.02}" stroke-width="2"/>`; }
  if(st.m==="sparks"){ for(let i=0;i<34;i++){const x=rnd()*W,y=rnd()*H,r=8+rnd()*26,c=p[1+Math.floor(rnd()*3)];g+=`<path d="M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r}Z" fill="${c}" opacity="${.5+rnd()*.5}"/>`} }
  if(st.m==="waves"){ for(let i=0;i<9;i++){const y=H*(.1+i*.1)+rnd()*30;g+=`<path d="M0 ${y} C ${W*.3} ${y-90}, ${W*.6} ${y+90}, ${W} ${y-30}" fill="none" stroke="${p[3]}" stroke-opacity=".2" stroke-width="2.5"/>`} }
  const bg=document.getElementById("bg"); bg.setAttribute("viewBox",`0 0 ${W} ${H}`); bg.innerHTML=g;
  document.getElementById("pic").style.background=`linear-gradient(135deg,${p[1]},${p[2]})`;
})();
document.getElementById("name").textContent = D.name;
document.getElementById("pic").textContent = D.initial || (D.name||"?")[0];
document.getElementById("model").textContent = D.model;
document.getElementById("rows").innerHTML = D.rows.map(r => `<div class="row"><b>${r[0]}</b><span>${r[1]}</span></div>`).join("");
document.getElementById("tabs").innerHTML = D.tabs;
document.getElementById("tip").textContent = D.tip;
document.getElementById("sum").textContent = D.sum;
if (D.battery) document.getElementById("batp").textContent = D.battery;
if (D.clock) document.getElementById("clock").textContent = D.clock;
</script>
</body></html>
